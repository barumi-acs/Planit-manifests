apiVersion: v1
kind: ConfigMap
metadata:
  name: planit-insight-config
  namespace: planit
data:
  SERVER_PORT: "8084"
  GRPC_SERVER_PORT: "9094"
  PLANIT_INSIGHT_DB_URL: "jdbc:mariadb://pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com:3306/planit_insight_db"
  PLANIT_INSIGHT_AI_CHAT_GRPC_TARGET: "static://planit-insightai-svc:9095"
  PLANIT_INSIGHT_AI_REPORT_GRPC_TARGET: "static://planit-insightai-svc:9095"
  PLANIT_USER_SERVICE_GRPC_TARGET: "static://planit-user-svc:9091"
  PLANIT_CORS_ALLOWED_ORIGINS: "https://barumi-planit.store,http://localhost:3000,http://localhost:5173"
  SPRING_DATASOURCE_URL: "jdbc:mariadb://pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com:3306/planit_insight_db"
  GRPC_CHAT_SERVICE_ADDRESS: "static://planit-insightai-svc:9095"
  GRPC_REPORT_SERVICE_ADDRESS: "static://planit-insightai-svc:9095"
  USER_SERVICE_GRPC_ADDRESS: "static://planit-user-svc:9091"
  AWS_REGION: "ap-northeast-2"
  DYNAMODB_TABLE_NAME: "PI-DEV-Insight-Dynamo"
---
apiVersion: v1
kind: Service
metadata:
  name: planit-insight-svc
  namespace: planit
spec:
  selector:
    app: insight
  ports:
    - name: http
      port: 8084
      targetPort: 8084
    - name: grpc
      port: 9094
      targetPort: 9094
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-insight-deploy
  namespace: planit
spec:
  selector:
    matchLabels:
      app: insight
  template:
    metadata:
      labels:
        app: insight
    spec:
      containers:
      - name: insight
        image: jybill01/planit-insight:v0.3
        ports:
        - containerPort: 8084
        - containerPort: 9094
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: SERVER_PORT
        - name: GRPC_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: GRPC_SERVER_PORT
        - name: PLANIT_INSIGHT_DB_URL
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: PLANIT_INSIGHT_DB_URL
        - name: PLANIT_INSIGHT_AI_CHAT_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: PLANIT_INSIGHT_AI_CHAT_GRPC_TARGET
        - name: PLANIT_INSIGHT_AI_REPORT_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: PLANIT_INSIGHT_AI_REPORT_GRPC_TARGET
        - name: PLANIT_USER_SERVICE_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: PLANIT_USER_SERVICE_GRPC_TARGET
        - name: PLANIT_CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: PLANIT_CORS_ALLOWED_ORIGINS
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: SPRING_DATASOURCE_URL
        - name: GRPC_CHAT_SERVICE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: GRPC_CHAT_SERVICE_ADDRESS
        - name: GRPC_REPORT_SERVICE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: GRPC_REPORT_SERVICE_ADDRESS
        - name: USER_SERVICE_GRPC_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: USER_SERVICE_GRPC_ADDRESS
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: AWS_REGION
        - name: DYNAMODB_TABLE_NAME
          valueFrom:
            configMapKeyRef:
              name: planit-insight-config
              key: DYNAMODB_TABLE_NAME
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_SECRET_ACCESS_KEY
