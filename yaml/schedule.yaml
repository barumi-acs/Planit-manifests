apiVersion: v1
kind: ConfigMap
metadata:
  name: planit-schedule-config
  namespace: planit
data:
  SERVER_PORT: "8082"
  GRPC_SERVER_PORT: "9092"
  PLANIT_SCHEDULE_DB_URL: "jdbc:mariadb://pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com:3306/planit_schedule_db"
  PLANIT_USER_SERVICE_GRPC_TARGET: "static://planit-user-svc:9091"
  PLANIT_INSIGHT_SERVICE_GRPC_TARGET: "static://planit-insight-svc:9094"
  PLANIT_CORS_ALLOWED_ORIGINS: "https://barumi-planit.store,http://localhost:3000,http://localhost:5173"
  SPRING_DATASOURCE_URL: "jdbc:mariadb://pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com:3306/planit_schedule_db"
  USER_SERVICE_GRPC_ADDRESS: "static://planit-user-svc:9091"
  INSIGHT_SERVICE_GRPC_ADDRESS: "static://planit-insight-svc:9094"
  GRPC_STUB_MODE: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: planit-schedule-svc
  namespace: planit
spec:
  selector:
    app: schedule
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-schedule-deploy
  namespace: planit
spec:
  selector:
    matchLabels:
      app: schedule
  template:
    metadata:
      labels:
        app: schedule
    spec:
      containers:
      - name: schedule
        image: jybill01/planit-schedule:v0.3
        ports:
        - containerPort: 8082
        - containerPort: 9092
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: SERVER_PORT
        - name: GRPC_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: GRPC_SERVER_PORT
        - name: PLANIT_SCHEDULE_DB_URL
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: PLANIT_SCHEDULE_DB_URL
        - name: PLANIT_USER_SERVICE_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: PLANIT_USER_SERVICE_GRPC_TARGET
        - name: PLANIT_INSIGHT_SERVICE_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: PLANIT_INSIGHT_SERVICE_GRPC_TARGET
        - name: PLANIT_CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: PLANIT_CORS_ALLOWED_ORIGINS
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: SPRING_DATASOURCE_URL
        - name: USER_SERVICE_GRPC_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: USER_SERVICE_GRPC_ADDRESS
        - name: INSIGHT_SERVICE_GRPC_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: INSIGHT_SERVICE_GRPC_ADDRESS
        - name: GRPC_STUB_MODE
          valueFrom:
            configMapKeyRef:
              name: planit-schedule-config
              key: GRPC_STUB_MODE
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_PASSWORD
