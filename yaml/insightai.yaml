apiVersion: v1
kind: ConfigMap
metadata:
  name: planit-insightai-config
  namespace: planit
data:
  APP_MODE: "grpc"
  PORT: "8085"
  GRPC_PORT: "9095"
  DB_HOST: "pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "planit_insight_db"
  AWS_REGION: "ap-northeast-2"
  BEDROCK_MODEL_ID: "anthropic.claude-3-5-sonnet-20240620-v1:0"
  BEDROCK_MAX_TOKENS: "4000"
  BEDROCK_TEMPERATURE: "0.7"
---
apiVersion: v1
kind: Service
metadata:
  name: planit-insightai-svc
  namespace: planit
spec:
  selector:
    app: insightai
  ports:
    - name: http
      port: 8085
      targetPort: 8085
    - name: grpc
      port: 9095
      targetPort: 9095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-insightai-deploy
  namespace: planit
spec:
  selector:
    matchLabels:
      app: insightai
  template:
    metadata:
      labels:
        app: insightai
    spec:
      containers:
      - name: insightai
        image: jybill01/planit-insightai:v0.1
        ports:
        - containerPort: 8085
        - containerPort: 9095
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: APP_MODE
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: PORT
        - name: GRPC_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: GRPC_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: DB_NAME
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: AWS_REGION
        - name: BEDROCK_MODEL_ID
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: BEDROCK_MODEL_ID
        - name: BEDROCK_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: BEDROCK_MAX_TOKENS
        - name: BEDROCK_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: planit-insightai-config
              key: BEDROCK_TEMPERATURE
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: DB_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_SECRET_ACCESS_KEY
