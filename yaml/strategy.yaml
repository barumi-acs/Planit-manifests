apiVersion: v1
kind: ConfigMap
metadata:
  name: planit-strategy-config
  namespace: planit
data:
  SERVER_PORT: "8083"
  GRPC_SERVER_PORT: "9093"
  PLANIT_STRATEGY_DB_URL: "jdbc:mariadb://pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com:3306/planit_strategy_db"
  PLANIT_SCHEDULE_SERVICE_GRPC_TARGET: "static://planit-schedule-svc:9092"
  PLANIT_USER_SERVICE_GRPC_TARGET: "static://planit-user-svc:9091"
  PLANIT_CORS_ALLOWED_ORIGINS: "https://barumi-planit.store,http://localhost:3000,http://localhost:5173"
  SPRING_DATASOURCE_URL: "jdbc:mariadb://pi-dev-mariadb.cbok2weui317.ap-northeast-2.rds.amazonaws.com:3306/planit_strategy_db"
  GRPC_SCHEDULE_SERVICE_ADDRESS: "static://planit-schedule-svc:9092"
  USER_SERVICE_GRPC_ADDRESS: "static://planit-user-svc:9091"
  AWS_REGION: "ap-northeast-2"
  BEDROCK_MODEL_ID: "anthropic.claude-3-5-sonnet-20240620-v1:0"
  BEDROCK_TEMPERATURE: "0.7"
---
apiVersion: v1
kind: Service
metadata:
  name: planit-strategy-svc
  namespace: planit
spec:
  selector:
    app: strategy
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: grpc
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-strategy-deploy
  namespace: planit
spec:
  selector:
    matchLabels:
      app: strategy
  template:
    metadata:
      labels:
        app: strategy
    spec:
      containers:
      - name: strategy
        image: jybill01/planit-strategy:v0.3
        ports:
        - containerPort: 8083
        - containerPort: 9093
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: SERVER_PORT
        - name: GRPC_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: GRPC_SERVER_PORT
        - name: PLANIT_STRATEGY_DB_URL
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: PLANIT_STRATEGY_DB_URL
        - name: PLANIT_SCHEDULE_SERVICE_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: PLANIT_SCHEDULE_SERVICE_GRPC_TARGET
        - name: PLANIT_USER_SERVICE_GRPC_TARGET
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: PLANIT_USER_SERVICE_GRPC_TARGET
        - name: PLANIT_CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: PLANIT_CORS_ALLOWED_ORIGINS
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: SPRING_DATASOURCE_URL
        - name: GRPC_SCHEDULE_SERVICE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: GRPC_SCHEDULE_SERVICE_ADDRESS
        - name: USER_SERVICE_GRPC_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: USER_SERVICE_GRPC_ADDRESS
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: AWS_REGION
        - name: BEDROCK_MODEL_ID
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: BEDROCK_MODEL_ID
        - name: BEDROCK_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: planit-strategy-config
              key: BEDROCK_TEMPERATURE
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_ACCESS_KEY
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_SECRET_KEY
        - name: GNEWS_API_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: GNEWS_API_KEY
