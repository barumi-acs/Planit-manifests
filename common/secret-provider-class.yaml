apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: planit-aws-secrets
  namespace: planit-dev
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "planit/dev/app-config"
        objectType: "secretsmanager"
        jmesPath:
          - path: DB_USERNAME
            objectAlias: DB_USERNAME
          - path: DB_PASSWORD
            objectAlias: DB_PASSWORD
          - path: AWS_ACCESS_KEY_ID
            objectAlias: AWS_ACCESS_KEY_ID
          - path: AWS_SECRET_ACCESS_KEY
            objectAlias: AWS_SECRET_ACCESS_KEY
          - path: COGNITO_CLIENT_SECRET
            objectAlias: COGNITO_CLIENT_SECRET
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
          - path: GNEWS_API_KEY
            objectAlias: GNEWS_API_KEY
  secretObjects:
    - secretName: planit-app-secrets
      type: Opaque
      data:
        - objectName: DB_USERNAME
          key: SPRING_DATASOURCE_USERNAME
        - objectName: DB_USERNAME
          key: DB_USER
        - objectName: DB_PASSWORD
          key: SPRING_DATASOURCE_PASSWORD
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: AWS_ACCESS_KEY_ID
          key: AWS_ACCESS_KEY_ID
        - objectName: AWS_ACCESS_KEY_ID
          key: AWS_ACCESS_KEY
        - objectName: AWS_SECRET_ACCESS_KEY
          key: AWS_SECRET_ACCESS_KEY
        - objectName: AWS_SECRET_ACCESS_KEY
          key: AWS_SECRET_KEY
        - objectName: COGNITO_CLIENT_SECRET
          key: COGNITO_CLIENT_SECRET
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: GNEWS_API_KEY
          key: GNEWS_API_KEY
