apiVersion: v1
kind: Service
metadata:
  name: planit-user-svc
  namespace: planit-dev
spec:
  selector:
    app: user
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-user-deploy
  namespace: planit-dev
spec:
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
        tier: backend
        env: dev
    spec:
      serviceAccountName: planit-app-sa
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: planit-aws-secrets
      containers:
      - name: user
        image: 935875533840.dkr.ecr.ap-northeast-2.amazonaws.com/pi-user:2ab4534fd1c7e200093f9efe6627f23dcdee6add
        ports:
        - containerPort: 8081
        - containerPort: 9091
        volumeMounts:
          - name: secrets-store
            mountPath: /mnt/secrets-store
            readOnly: true
        envFrom:
          - configMapRef:
              name: planit-user-config
        env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: JWT_SECRET
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_ACCESS_KEY
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: AWS_SECRET_KEY
        - name: COGNITO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: planit-app-secrets
              key: COGNITO_CLIENT_SECRET
